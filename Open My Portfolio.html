<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open My Portfolio</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f8f9fb;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .box {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 460px;
    }
    h1 { font-size: 1.4rem; }
    p { color: #6b7280; line-height: 1.6; }
    code {
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 0.15rem 0.4rem;
      font-size: 0.9em;
      display: block;
      margin: 0.75rem 0;
      white-space: pre-wrap;
    }
    button {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.4rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    #status { font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Nikita Xu — Portfolio</h1>
    <p id="status">Checking if your site is running…</p>
    <div id="help" style="display:none">
      <p>Your site isn't running yet. Open Terminal and run:</p>
      <code>cd ~/Viber/ISBA2438/portfolio
npm run dev</code>
      <p>Then click retry.</p>
      <button onclick="check()">Retry</button>
    </div>
  </div>

  <script>
    function check() {
      document.getElementById("status").textContent = "Checking if your site is running…";
      var probe = new Image();
      probe.onload = function () {
        window.location.href = "http://localhost:3000";
      };
      probe.onerror = function () {
        document.getElementById("status").textContent = "Your site isn't running.";
        document.getElementById("help").style.display = "block";
      };
      probe.src = "http://localhost:3000/favicon.ico?" + Date.now();
    }
    check();
  </script>
</body>
</html>
